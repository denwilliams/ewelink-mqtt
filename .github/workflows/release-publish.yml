name: publish release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i
      - run: ./sea.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: .sea/ewelink-mqtt-*
